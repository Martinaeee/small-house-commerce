name: small-house-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      args:
        # Empty = official npmjs registry; a mirror (npmmirror.com) lets
        # regions where npmjs is unreachable/flaky still build. See the
        # Dockerfiles' COREPACK_NPM_REGISTRY / NPM_CONFIG_REGISTRY args.
        COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-1h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # After admin writes the backend pings the frontend's internal
      # /api/internal/revalidate route (shared secret, docker network).
      REVALIDATE_URL: http://frontend:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Homepage draft-preview token signing (>=32 chars). Set in .env.deploy;
      # when blank the preview-token routes answer 503.
      HOMEPAGE_PREVIEW_SECRET: ${HOMEPAGE_PREVIEW_SECRET:-}
      # Optional Resend delivery. Blank values select the local structured-log
      # gateway; when EMAIL_API_KEY is set, boot validation requires all three.
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Replies to automated mail go here; blank omits the Reply-To header.
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-}
      # Meta Conversions API (server-side). Blank token keeps it disabled;
      # the browser Pixel is independent and consent-gated.
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_CAPI_TEST_EVENT_CODE: ${META_CAPI_TEST_EVENT_CODE:-}
      META_CAPI_API_VERSION: ${META_CAPI_API_VERSION:-v23.0}
      # Qianyi ERP. Keep QIANYI_ENABLED=false until every go-live gate in
      # docs/superpowers/runbooks/qianyi-erp-go-live.md is signed off.
      QIANYI_ENABLED: ${QIANYI_ENABLED:-false}
      QIANYI_BASE_URL: ${QIANYI_BASE_URL:-https://www.qianyierp.com}
      QIANYI_APP_ID: ${QIANYI_APP_ID:-}
      QIANYI_APP_SECRET: ${QIANYI_APP_SECRET:-}
      QIANYI_SHOP: ${QIANYI_SHOP:-}
      QIANYI_WAREHOUSE_ID: ${QIANYI_WAREHOUSE_ID:-}
      QIANYI_WAREHOUSE: ${QIANYI_WAREHOUSE:-}
      QIANYI_LOCAL_WAREHOUSE_ID: ${QIANYI_LOCAL_WAREHOUSE_ID:-}
      QIANYI_LOGISTICS: ${QIANYI_LOGISTICS:-}
      # Local image uploads (no R2 configured): files persist in this volume
      # and are served by the backend at /uploads/* (Caddy routes it here).
      UPLOAD_DIR: /app/uploads
      UPLOAD_STORAGE_DURABLE: "true"
    volumes:
      - uploads_data:/app/uploads
      # Host-collected read-only status snapshot for the admin status page.
      - /var/lib/luwag:/app/status:ro

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        # Public origin baked into metadata/sitemap/robots/JSON-LD. Empty
        # falls back to https://luwag.shop in src/lib/site-url.ts.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        # Baked into the /uploads rewrite so the in-container Next image
        # optimizer can fetch uploaded originals from the backend.
        API_TARGET: ${API_TARGET:-http://backend:3000}
        # Same registry-mirror escape hatch as backend (see the Dockerfiles).
        COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Used at request time by Server Components (serverApiUrl) for SSR/ISR
      # data fetches. It does not steer browser traffic: Caddy routes
      # /api/v1/* directly to the backend, and the baked Next rewrite is
      # dev-only.
      API_TARGET: http://backend:3000
      # Runtime-only (no NEXT_PUBLIC prefix): authenticates the backend's
      # on-demand revalidation calls to /api/internal/revalidate.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/luwag/tls:/etc/caddy/certs:ro
      - prod_caddy_data:/data
      - prod_caddy_config:/config

volumes:
  prod_pgdata:
  prod_caddy_data:
  prod_caddy_config:
  uploads_data:
