# pnpm settings. pnpm 11+ reads these from pnpm-workspace.yaml, not from
# package.json, and blocks every dependency postinstall script by default.
# `allowBuilds` is the v11+ replacement for the removed `onlyBuiltDependencies`.
#
# unrs-resolver is pulled in by eslint-config-next and must build a native
# binding, so it is explicitly reviewed and allowed. esbuild is vitest's
# transform runtime and needs its platform binary too. Everything else stays
# denied.
allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  "@puckeditor/core@0.23.0>@tiptap/extension-blockquote": 3.31.4
  "@puckeditor/core@0.23.0>@tiptap/extension-code": 3.31.4
  "@puckeditor/core@0.23.0>@tiptap/extension-code-block": 3.31.4
  "@puckeditor/core@0.23.0>@tiptap/extension-hard-break": 3.31.4
  "@puckeditor/core@0.23.0>@tiptap/extension-heading": 3.31.4
  "@puckeditor/core@0.23.0>@tiptap/extension-horizontal-rule": 3.31.4
  "@puckeditor/core@0.23.0>@tiptap/extension-link": 3.31.4
  "@puckeditor/core@0.23.0>@tiptap/extension-list": 3.31.4
  "@puckeditor/core@0.23.0>@tiptap/html": 3.31.4

patchedDependencies:
  next@16.3.4: patches/next@16.3.4.patch
