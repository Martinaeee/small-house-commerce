# pnpm settings. pnpm 11+ reads these from pnpm-workspace.yaml, not from
# package.json, and blocks every dependency postinstall script by default.
# `allowBuilds` is the v11+ replacement for the removed `onlyBuiltDependencies`.
#
# All four entries genuinely need their install scripts: @prisma/engines
# fetches the query engine binary, esbuild installs its platform binary, the
# prisma CLI has its own postinstall, and argon2 compiles its native binding
# for password hashing. Everything else stays denied by default.
allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
